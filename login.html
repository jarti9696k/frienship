<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Friendship</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-page {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #eef2ff, #ffffff);
        }

        .login-card {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4f46e5;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #4f46e5 !important;
            padding: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .login-button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4338ca;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .register-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: #4f46e5;
        }

        .flash-message {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>


<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <h2>Friendship</h2>

    <div>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </div>

</nav>


<!-- ================= LOGIN ================= -->

<div class="login-page">

    <div class="login-card">

        <h1>Welcome Back 👋</h1>

        <p class="login-subtitle">
            Login to your Friendship account
        </p>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <!-- Register -->

        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>


        <!-- Home -->

        <a
            href="{{ url_for('home') }}"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<script>

    const showPassword =
        document.getElementById("showPassword");

    const password =
        document.getElementById("password");


    if (showPassword && password) {

        showPassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                showPassword.textContent = "Hide";

            } else {

                password.type = "password";

                showPassword.textContent = "Show";

            }

        });

    }

</script>

</body>
</html>
